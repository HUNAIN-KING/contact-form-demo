<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Contact card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .contact-card { max-width: 500px; border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .btn-custom { background-color: #2563eb; color: #fff; font-weight: 600; padding: 12px; border-radius: 8px; }
    .btn-custom:hover { background-color: #1d4ed8; color: #fff; }
  </style>

</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card contact--card w-100 p-4 p-md-5">
        <h3 class="fw-bold text-dark mb-1">Let's connect</h3>
        <p class="text-muted mb-4 small ">Fill out the form below and we'll get back to you shortly.</p>

        <form action="https://formspree.io/f/YOUR_FORMSPREE_ENDPOINT" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Full Name</label>
        <input type="text" name="name" class="form-control form-control-lg fs-6" placeholder="Jane Doe" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary small">Email Address</label>
        <input type="email" name="_replyto" class="form-control form-control-lg fs-6" placeholder="jane@example.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold text-secondary small">Message</label>
        <textarea name="message" class="form-control fs-6" rows="4" placeholder="Tell us about your project..." required></textarea>
      </div>
      <button type="submit" class="btn btn-custom w-100 fs-6">Submit Inquiry</button>
        </form>
    </div>
    
</body>
</html>
